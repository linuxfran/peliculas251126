<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Busca y filtra películas por género en CineMundo.">
    <title>Películas | CineMundo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="encabezado">
        <a class="marca" href="index.html" aria-label="CineMundo, inicio">🎬 CineMundo</a>
        <nav aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="peliculas.html" aria-current="page">Películas</a>
            <a href="documentales.html">Documentales</a>
            <a href="favoritos.html">Favoritos</a>
        </nav>
    </header>
    <main>
        <p class="sobre-titulo">Encuentra tu próxima historia</p>
        <h1>Películas</h1>
        <p class="introduccion">Busca por título o explora tus géneros favoritos.</p>
        <div class="controles-catalogo">
            <label class="solo-lectores" for="buscador">Buscar películas</label>
            <input type="search" id="buscador" placeholder="Buscar película...">
            <label class="solo-lectores" for="filtro">Filtrar por género</label>
            <select id="filtro">
                <option value="todos">Todos los géneros</option>
                <option value="Acción">Acción</option>
                <option value="Ciencia ficción">Ciencia ficción</option>
                <option value="Animación">Animación</option>
                <option value="Drama">Drama</option>
            </select>
        </div>
        <div id="catalogo" class="catalogo"></div>
    </main>
    <footer><p>© 2026 CineMundo</p></footer>
    <script src="js/app.js"></script>
</body>
</html>
